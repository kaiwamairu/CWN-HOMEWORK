="240" height="76" rx="7"/><text class="node-index" x="14" y="17">01</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">เข้ารายการรออนุมัติ</text><text class="node-sub" x="14" y="59">เฉพาะเรื่องที่ส่งถึงหัวหน้า</text></g><g class="node " transform="translate(360,160)"><title>เปิดคำขอและเอกสาร</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">02</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">เปิดคำขอและเอกสาร</text><text class="node-sub" x="14" y="59">ดูข้อมูลทุกแผนกตามสิทธิ์</text></g><g class="node decision" transform="translate(360,290)"><title>อนุมัติหรือไม่อนุมัติ?</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">03</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">อนุมัติหรือไม่อนุมัติ?</text><text class="node-sub" x="14" y="59">ตรวจ role + service + state</text></g><g class="node " transform="translate(690,420)"><title>ระบุเหตุผลไม่อนุมัติ</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">04</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ระบุเหตุผลไม่อนุมัติ</text><text class="node-sub" x="14" y="59">trim แล้วอย่างน้อย 10 ตัว</text></g><g class="node alert" transform="translate(690,550)"><title>ปิดเรื่องไม่อนุมัติ</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">05</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ปิดเรื่องไม่อนุมัติ</text><text class="node-sub" x="14" y="59">REJECT audit + closedAt</text></g><g class="node " transform="translate(30,420)"><title>บันทึกผลอนุมัติ</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">06</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">บันทึกผลอนุมัติ</text><text class="node-sub" x="14" y="59">หัวหน้าเป็นผู้ลงนาม</text></g><g class="node " transform="translate(30,550)"><title>ส่งให้ผู้ออกเอกสาร</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">07</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ส่งให้ผู้ออกเอกสาร</text><text class="node-sub" x="14" y="59">ผู้รับทะเบียนครั้งแรก</text></g><g class="node end" transform="translate(360,550)"><title>ประชาชนรับเอกสาร</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">08</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ประชาชนรับเอกสาร</text><text class="node-sub" x="14" y="59">รหัสตรวจสอบ + PDF</text></g></svg>