<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 605" role="img" aria-label="เจ้าหน้าที่ · รับเรื่อง ตรวจและส่งต่อ"><title>เจ้าหน้าที่ · รับเรื่อง ตรวจและส่งต่อ</title><desc>คิวแยกตามแผนกและรับเรื่องแบบผู้ถือเดียว ตีกลับตามเงื่อนไข หรือส่งเข้าสู่ขั้นที่กำหนดโดยบริการ</desc><style>.edge{fill:none;stroke:#9fae98;stroke-width:1.6}.edge-label{font:10px Tahoma,sans-serif;fill:#62735b;paint-order:stroke;stroke:#fbfcf8;stroke-width:5;stroke-linejoin:round}.node rect{fill:#fff;stroke:#c7d2be;stroke-width:1.2}.node.decision rect{fill:#fbf2e1;stroke:#d8c193}.node.end rect{fill:#e7f0dc;stroke:#b8cba6}.node.alert rect{fill:#f8eae4;stroke:#ddbeb0}.node.active rect{stroke:#286143;stroke-width:2.5;fill:#e7f0da}.node-index{font:9px Consolas,monospace;fill:#8b9a7f}.node-title{font:600 13px Tahoma,sans-serif;fill:#294632}.node-sub{font:10px Tahoma,sans-serif;fill:#75836d}.node-dot{fill:#91aa7c}</style><rect width="100%" height="100%" fill="#fbfcf8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9fae98"/></marker></defs><path class="edge" d="M 270 68 L 360 68" marker-end="url(#arrow)"/><path class="edge" d="M 600 68 L 690 68" marker-end="url(#arrow)"/><path class="edge" d="M 810 106 C 810 143.0,810 143.0,810 180" marker-end="url(#arrow)"/><text class="edge-label" x="810.0" y="136.0" text-anchor="middle">ต้องแก้ไข</text><path class="edge" d="M 690 218 L 600 218" marker-end="url(#arrow)"/><text class="edge-label" x="645.0" y="209" text-anchor="middle">ส่งแก้ทันเวลา</text><path class="edge" d="M 480 180 C 480 143.0,810 143.0,810 106" marker-end="url(#arrow)"/><text class="edge-label" x="645.0" y="136.0" text-anchor="middle">ตรวจอีกครั้ง</text><path class="edge" d="M 810 106 C 810 143.0,150 143.0,150 180" marker-end="url(#arrow)"/><text class="edge-label" x="480.0" y="136.0" text-anchor="middle">ผ่านการตรวจ</text><path class="edge" d="M 150 256 C 150 293.0,150 293.0,150 330" marker-end="url(#arrow)"/><path class="edge" d="M 270 368 L 360 368" marker-end="url(#arrow)"/><text class="edge-label" x="315.0" y="359" text-anchor="middle">อนุมัติ</text><path class="edge" d="M 150 406 C 150 443.0,810 443.0,810 480" marker-end="url(#arrow)"/><text class="edge-label" x="480.0" y="436.0" text-anchor="middle">ไม่อนุมัติ</text><path class="edge" d="M 480 406 C 480 443.0,480 443.0,480 480" marker-end="url(#arrow)"/><g class="node " transform="translate(30,30)"><title>เปิดคิวแผนก</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">01</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">เปิดคิวแผนก</text><text class="node-sub" x="14" y="59">กำหนดเร็วสุด → เลขคำขอ</text></g><g class="node " transform="translate(360,30)"><title>รับเรื่องแบบ atomic</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">02</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">รับเรื่องแบบ atomic</text><text class="node-sub" x="14" y="59">ตรวจสิทธิ์ → ผู้ถือ → เพดาน</text></g><g class="node decision" transform="translate(690,30)"><title>ตรวจเอกสารและตัวตน</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">03</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ตรวจเอกสารและตัวตน</text><text class="node-sub" x="14" y="59">เปิดไฟล์ตามแผนกที่เคยผ่าน</text></g><g class="node " transform="translate(690,180)"><title>ตีกลับเพื่อแก้ไข</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">04</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ตีกลับเพื่อแก้ไข</text><text class="node-sub" x="14" y="59">สูงสุด 2 ครั้งต่อคำขอ</text></g><g class="node " transform="translate(360,180)"><title>ประชาชนส่งแก้กลับ</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">05</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ประชาชนส่งแก้กลับ</text><text class="node-sub" x="14" y="59">คืนผู้ถือเดิมอัตโนมัติ</text></g><g class="node " transform="translate(30,180)"><title>ส่งให้ผู้มีอำนาจพิจารณา</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">06</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ส่งให้ผู้มีอำนาจพิจารณา</text><text class="node-sub" x="14" y="59">เส้นทางตาม SV-01 / 02 / 03</text></g><g class="node decision" transform="translate(30,330)"><title>ตัดสินตามอำนาจบริการ</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">07</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ตัดสินตามอำนาจบริการ</text><text class="node-sub" x="14" y="59">อนุมัติ / ไม่อนุมัติ</text></g><g class="node " transform="translate(360,330)"><title>เจ้าหน้าที่ออกเอกสาร</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">08</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">เจ้าหน้าที่ออกเอกสาร</text><text class="node-sub" x="14" y="59">ผู้ลงนามคือผู้อนุมัติ</text></g><g class="node alert" transform="translate(690,480)"><title>ปิดแบบไม่อนุมัติ</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">09</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ปิดแบบไม่อนุมัติ</text><text class="node-sub" x="14" y="59">บันทึกเหตุผลและเวลา</text></g><g class="node end" transform="translate(360,480)"><title>ส่งมอบเอกสารให้ประชาชน</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">10</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ส่งมอบเอกสารให้ประชาชน</text><text class="node-sub" x="14" y="59">ดาวน์โหลดและ verify ได้</text></g></svg>