="node-index" x="14" y="17">06</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ตรวจสิทธิ์และค่าก่อนบันทึก</text><text class="node-sub" x="14" y="59">ค่าผิดไม่เปลี่ยนข้อมูล</text></g><g class="node end" transform="translate(360,570)"><title>บันทึกพร้อม ADMIN_CHANGE</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">07</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">บันทึกพร้อม ADMIN_CHANGE</text><text class="node-sub" x="14" y="59">ค่าก่อน → ค่าหลัง</text></g><g class="node end" transform="translate(690,570)"><title>ทดสอบผลเมื่อเข้าสู่ระบบใหม่</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">08</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ทดสอบผลเมื่อเข้าสู่ระบบใหม่</text><text class="node-sub" x="14" y="59">เฉพาะการแก้บทบาท</text></g></svg>