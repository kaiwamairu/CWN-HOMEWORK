ision" transform="translate(690,180)"><title>OTP ถูกต้องหรือไม่?</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">04</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">OTP ถูกต้องหรือไม่?</text><text class="node-sub" x="14" y="59">สำเร็จล้างตัวนับผิด</text></g><g class="node decision" transform="translate(360,180)"><title>เพิ่มจำนวนครั้งที่ผิด</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">05</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">เพิ่มจำนวนครั้งที่ผิด</text><text class="node-sub" x="14" y="59">ผิด 2 ครั้งยังลองได้</text></g><g class="node alert" transform="translate(30,180)"><title>ล็อก 15 นาที</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">06</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ล็อก 15 นาที</text><text class="node-sub" x="14" y="59">นับจากครั้งที่ 3</text></g><g class="node " transform="translate(30,330)"><title>ครบเวลาแล้วลองใหม่</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">07</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ครบเวลาแล้วลองใหม่</text><text class="node-sub" x="14" y="59">ไม่ต้องสร้างบัญชีใหม่</text></g><g class="node decision" transform="translate(360,330)"><title>เป็นผู้ใช้ที่ลงทะเบียนแล้ว?</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">08</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">เป็นผู้ใช้ที่ลงทะเบียนแล้ว?</text><text class="node-sub" x="14" y="59">session ใหม่หลังยืนยันสำเร็จ</text></g><g class="node " transform="translate(690,330)"><title>ลงทะเบียนและยินยอม</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">09</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ลงทะเบียนและยินยอม</text><text class="node-sub" x="14" y="59">มือถือ + PDPA</text></g><g class="node end" transform="translate(690,480)"><title>เข้าสู่บริการของฉัน</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">10</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">เข้าสู่บริการของฉัน</text><text class="node-sub" x="14" y="59">ดูเฉพาะทรัพยากรตนเอง</text></g></svg>