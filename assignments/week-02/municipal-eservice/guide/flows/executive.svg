<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 455" role="img" aria-label="ผู้บริหาร · Dashboard และรายงาน"><title>ผู้บริหาร · Dashboard และรายงาน</title><desc>มองข้อมูลรวมตามเดือน ปี และบริการ แยกยอดในช่วงเวลาออกจากงานคงค้างปัจจุบัน โดยไม่มีข้อมูลผู้ยื่นส่วนบุคคล</desc><style>.edge{fill:none;stroke:#9fae98;stroke-width:1.6}.edge-label{font:10px Tahoma,sans-serif;fill:#62735b;paint-order:stroke;stroke:#fbfcf8;stroke-width:5;stroke-linejoin:round}.node rect{fill:#fff;stroke:#c7d2be;stroke-width:1.2}.node.decision rect{fill:#fbf2e1;stroke:#d8c193}.node.end rect{fill:#e7f0dc;stroke:#b8cba6}.node.alert rect{fill:#f8eae4;stroke:#ddbeb0}.node.active rect{stroke:#286143;stroke-width:2.5;fill:#e7f0da}.node-index{font:9px Consolas,monospace;fill:#8b9a7f}.node-title{font:600 13px Tahoma,sans-serif;fill:#294632}.node-sub{font:10px Tahoma,sans-serif;fill:#75836d}.node-dot{fill:#91aa7c}</style><rect width="100%" height="100%" fill="#fbfcf8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9fae98"/></marker></defs><path class="edge" d="M 270 68 L 360 68" marker-end="url(#arrow)"/><path class="edge" d="M 600 68 L 690 68" marker-end="url(#arrow)"/><path class="edge" d="M 810 106 C 810 143.0,810 143.0,810 180" marker-end="url(#arrow)"/><path class="edge" d="M 690 218 L 600 218" marker-end="url(#arrow)"/><path class="edge" d="M 360 218 L 270 218" marker-end="url(#arrow)"/><path class="edge" d="M 150 256 C 150 293.0,150 293.0,150 330" marker-end="url(#arrow)"/><g class="node " transform="translate(30,30)"><title>เข้าสู่บทบาทผู้บริหาร</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">01</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">เข้าสู่บทบาทผู้บริหาร</text><text class="node-sub" x="14" y="59">exec1 → Dashboard</text></g><g class="node " transform="translate(360,30)"><title>เลือกเดือน ปี และบริการ</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">02</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">เลือกเดือน ปี และบริการ</text><text class="node-sub" x="14" y="59">period + service</text></g><g class="node " transform="translate(690,30)"><title>อ่านยอดรับและปิดงาน</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">03</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">อ่านยอดรับและปิดงาน</text><text class="node-sub" x="14" y="59">รับตาม paidAt / ปิดตาม closedAt</text></g><g class="node " transform="translate(690,180)"><title>อ่านสัดส่วนทันกำหนด</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">04</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">อ่านสัดส่วนทันกำหนด</text><text class="node-sub" x="14" y="59">onTime ÷ closed ×100</text></g><g class="node " transform="translate(360,180)"><title>อ่านคงค้างและภาระงาน</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">05</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">อ่านคงค้างและภาระงาน</text><text class="node-sub" x="14" y="59">ข้อมูล ณ นาฬิกาปัจจุบัน</text></g><g class="node " transform="translate(30,180)"><title>ส่งออก Excel หรือ PDF</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">06</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ส่งออก Excel หรือ PDF</text><text class="node-sub" x="14" y="59">ค่าเท่ากับหน้าจอ 5 KPI</text></g><g class="node end" transform="translate(30,330)"><title>บันทึก EXPORT แล้วส่งไฟล์</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">07</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">บันทึก EXPORT แล้วส่งไฟล์</text><text class="node-sub" x="14" y="59">รูปแบบ + period + service</text></g></svg>