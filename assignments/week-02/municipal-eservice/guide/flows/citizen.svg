<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="ประชาชน · ยื่นคำขอจนได้รับเอกสาร"><title>ประชาชน · ยื่นคำขอจนได้รับเอกสาร</title><desc>วงจรหลักตั้งแต่ยืนยันตัวตน ยื่นและจ่ายเงิน จนได้รับ PDF รวมการแก้ไขและยกเลิกตามเงื่อนไข โดยผู้ใช้เห็นเฉพาะคำขอของตนเอง</desc><style>.edge{fill:none;stroke:#9fae98;stroke-width:1.6}.edge-label{font:10px Tahoma,sans-serif;fill:#62735b;paint-order:stroke;stroke:#fbfcf8;stroke-width:5;stroke-linejoin:round}.node rect{fill:#fff;stroke:#c7d2be;stroke-width:1.2}.node.decision rect{fill:#fbf2e1;stroke:#d8c193}.node.end rect{fill:#e7f0dc;stroke:#b8cba6}.node.alert rect{fill:#f8eae4;stroke:#ddbeb0}.node.active rect{stroke:#286143;stroke-width:2.5;fill:#e7f0da}.node-index{font:9px Consolas,monospace;fill:#8b9a7f}.node-title{font:600 13px Tahoma,sans-serif;fill:#294632}.node-sub{font:10px Tahoma,sans-serif;fill:#75836d}.node-dot{fill:#91aa7c}</style><rect width="100%" height="100%" fill="#fbfcf8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9fae98"/></marker></defs><path class="edge" d="M 270 68 L 360 68" marker-end="url(#arrow)"/><path class="edge" d="M 600 68 L 690 68" marker-end="url(#arrow)"/><text class="edge-label" x="645.0" y="59" text-anchor="middle">ผู้ใช้ใหม่</text><path class="edge" d="M 480 106 C 480 143.0,810 143.0,810 180" marker-end="url(#arrow)"/><text class="edge-label" x="645.0" y="136.0" text-anchor="middle">ลงทะเบียนแล้ว</text><path class="edge" d="M 810 106 C 810 143.0,810 143.0,810 180" marker-end="url(#arrow)"/><path class="edge" d="M 690 218 L 600 218" marker-end="url(#arrow)"/><path class="edge" d="M 360 218 L 270 218" marker-end="url(#arrow)"/><text class="edge-label" x="315.0" y="209" text-anchor="middle">ครบแล้ว</text><path class="edge" d="M 150 256 C 150 293.0,150 293.0,150 330" marker-end="url(#arrow)"/><text class="edge-label" x="150.0" y="286.0" text-anchor="middle">จ่ายสำเร็จ</text><path class="edge" d="M 270 368 L 360 368" marker-end="url(#arrow)"/><text class="edge-label" x="315.0" y="359" text-anchor="middle">มีผู้รับเรื่อง</text><path class="edge" d="M 600 368 L 690 368" marker-end="url(#arrow)"/><text class="edge-label" x="645.0" y="359" text-anchor="middle">ตีกลับ</text><path class="edge" d="M 810 330 C 810 295,480 295,480 330" marker-end="url(#arrow)"/><text class="edge-label" x="645.0" y="290" text-anchor="middle">ส่งแก้ทันเวลา</text><path class="edge" d="M 810 406 C 810 443.0,810 443.0,810 480" marker-end="url(#arrow)"/><text class="edge-label" x="810.0" y="436.0" text-anchor="middle">ครบ 168 ชม.</text><path class="edge" d="M 480 406 C 480 443.0,480 443.0,480 480" marker-end="url(#arrow)"/><text class="edge-label" x="480.0" y="436.0" text-anchor="middle">ผ่านตามอำนาจ</text><path class="edge" d="M 360 518 L 270 518" marker-end="url(#arrow)"/><text class="edge-label" x="315.0" y="509" text-anchor="middle">ออก PDF</text><path class="edge" d="M 30 368 H 8 V 620 H 810 V 556" marker-end="url(#arrow)"/><text class="edge-label" x="420" y="613" text-anchor="middle">ยังไม่มีผู้ถือ</text><g class="node " transform="translate(30,30)"><title>ยืนยันตัวตน</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">01</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ยืนยันตัวตน</text><text class="node-sub" x="14" y="59">ThaiD จำลอง + OTP</text></g><g class="node decision" transform="translate(360,30)"><title>เคยลงทะเบียนแล้ว?</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">02</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">เคยลงทะเบียนแล้ว?</text><text class="node-sub" x="14" y="59">แยกผู้ใช้เดิม / ผู้ใช้ใหม่</text></g><g class="node " transform="translate(690,30)"><title>ลงทะเบียนครั้งแรก</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">03</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ลงทะเบียนครั้งแรก</text><text class="node-sub" x="14" y="59">ชื่อจาก ThaiD แก้ไม่ได้</text></g><g class="node " transform="translate(690,180)"><title>เลือกบริการและบันทึกร่าง</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">04</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">เลือกบริการและบันทึกร่าง</text><text class="node-sub" x="14" y="59">SV-01 / SV-02 / SV-03</text></g><g class="node " transform="translate(360,180)"><title>แนบหลักฐานให้ครบ</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">05</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">แนบหลักฐานให้ครบ</text><text class="node-sub" x="14" y="59">PDF / JPG / PNG จริง</text></g><g class="node " transform="translate(30,180)"><title>สร้าง QR และชำระ</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">06</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">สร้าง QR และชำระ</text><text class="node-sub" x="14" y="59">ล็อกยอดเมื่อเข้า PENDING_PAYMENT</text></g><g class="node " transform="translate(30,330)"><title>ได้เลขคำขอและใบเสร็จ</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">07</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ได้เลขคำขอและใบเสร็จ</text><text class="node-sub" x="14" y="59">เลขออกเมื่อชำระสำเร็จเท่านั้น</text></g><g class="node " transform="translate(360,330)"><title>ติดตามการตรวจพิจารณา</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">08</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ติดตามการตรวจพิจารณา</text><text class="node-sub" x="14" y="59">คิว → ตรวจ → ส่งต่อ</text></g><g class="node decision" transform="translate(690,330)"><title>แก้ไขเอกสาร</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">09</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">แก้ไขเอกสาร</text><text class="node-sub" x="14" y="59">ตีกลับรวมไม่เกิน 2 ครั้ง</text></g><g class="node alert" transform="translate(690,480)"><title>ยกเลิกคำขอ</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">10</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ยกเลิกคำขอ</text><text class="node-sub" x="14" y="59">ยืนยันเอง / หมดเวลาแก้ไข</text></g><g class="node " transform="translate(360,480)"><title>อนุมัติแล้ว รอออกเอกสาร</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">11</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">อนุมัติแล้ว รอออกเอกสาร</text><text class="node-sub" x="14" y="59">ผู้อนุมัติตามบริการ</text></g><g class="node end" transform="translate(30,480)"><title>ดาวน์โหลดและตรวจเอกสาร</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">12</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ดาวน์โหลดและตรวจเอกสาร</text><text class="node-sub" x="14" y="59">PDF + รหัสตรวจสอบ</text></g></svg>