<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 455" role="img" aria-label="ทีมพัฒนา · ตรวจรับและพิสูจน์การจับบั๊ก"><title>ทีมพัฒนา · ตรวจรับและพิสูจน์การจับบั๊ก</title><desc>แผนตรวจรับ 51 IDs ประกอบด้วย 50 browser/API cases และ 1 database/filesystem inspection ทุก TC เริ่ม reset แล้วเข้าสู่ระบบใหม่</desc><style>.edge{fill:none;stroke:#9fae98;stroke-width:1.6}.edge-label{font:10px Tahoma,sans-serif;fill:#62735b;paint-order:stroke;stroke:#fbfcf8;stroke-width:5;stroke-linejoin:round}.node rect{fill:#fff;stroke:#c7d2be;stroke-width:1.2}.node.decision rect{fill:#fbf2e1;stroke:#d8c193}.node.end rect{fill:#e7f0dc;stroke:#b8cba6}.node.alert rect{fill:#f8eae4;stroke:#ddbeb0}.node.active rect{stroke:#286143;stroke-width:2.5;fill:#e7f0da}.node-index{font:9px Consolas,monospace;fill:#8b9a7f}.node-title{font:600 13px Tahoma,sans-serif;fill:#294632}.node-sub{font:10px Tahoma,sans-serif;fill:#75836d}.node-dot{fill:#91aa7c}</style><rect width="100%" height="100%" fill="#fbfcf8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9fae98"/></marker></defs><path class="edge" d="M 270 68 L 360 68" marker-end="url(#arrow)"/><path class="edge" d="M 600 68 L 690 68" marker-end="url(#arrow)"/><path class="edge" d="M 810 106 C 810 143.0,810 143.0,810 180" marker-end="url(#arrow)"/><path class="edge" d="M 690 218 L 600 218" marker-end="url(#arrow)"/><path class="edge" d="M 360 218 L 270 218" marker-end="url(#arrow)"/><path class="edge" d="M 150 256 C 150 293.0,150 293.0,150 330" marker-end="url(#arrow)"/><path class="edge" d="M 270 368 L 360 368" marker-end="url(#arrow)"/><g class="node " transform="translate(30,30)"><title>เตรียมโหมดและข้อมูล</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">01</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">เตรียมโหมดและข้อมูล</text><text class="node-sub" x="14" y="59">TEST_MODE=1 · BUG_MODE ว่าง</text></g><g class="node " transform="translate(360,30)"><title>รัน baseline รอบแรก</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">02</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">รัน baseline รอบแรก</text><text class="node-sub" x="14" y="59">51 acceptance outcomes ต้องผ่าน</text></g><g class="node " transform="translate(690,30)"><title>รันรอบสอง server เดิม</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">03</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">รันรอบสอง server เดิม</text><text class="node-sub" x="14" y="59">ไม่ restart ระหว่าง baseline</text></g><g class="node " transform="translate(690,180)"><title>เปิด B01–B12 ทีละตัว</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">04</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">เปิด B01–B12 ทีละตัว</text><text class="node-sub" x="14" y="59">restart server ต่อโหมด</text></g><g class="node decision" transform="translate(360,180)"><title>เปรียบเทียบชุด TC ที่ล้ม</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">05</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">เปรียบเทียบชุด TC ที่ล้ม</text><text class="node-sub" x="14" y="59">required ⊆ observed ⊆ required∪allowed</text></g><g class="node " transform="translate(30,180)"><title>ทดสอบโหมดรวมสองชุด</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">06</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ทดสอบโหมดรวมสองชุด</text><text class="node-sub" x="14" y="59">B03,B07 และ B01,B05,B09</text></g><g class="node " transform="translate(30,330)"><title>ปิดบั๊กและตรวจ hooks ปิด</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">07</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ปิดบั๊กและตรวจ hooks ปิด</text><text class="node-sub" x="14" y="59">กลับ baseline แล้ว TEST_MODE unset</text></g><g class="node end" transform="translate(360,330)"><title>ส่งรายงานและ triage</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">08</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ส่งรายงานและ triage</text><text class="node-sub" x="14" y="59">JSON / HTML / trace / inspection</text></g></svg>