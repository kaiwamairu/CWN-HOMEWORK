<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 675" role="img" aria-label="ระบบ · นาฬิกา SLA และการแจ้งเตือน"><title>ระบบ · นาฬิกา SLA และการแจ้งเตือน</title><desc>ทุก HTTP request ยกเว้น /api/test/* ประเมินหมดเวลาแก้ไขและระดับเตือนจากนาฬิกาเดียวกัน ไม่รอ cron และไม่แจ้งย้อนหลังทุกระดับที่ข้ามไป</desc><style>.edge{fill:none;stroke:#9fae98;stroke-width:1.6}.edge-label{font:10px Tahoma,sans-serif;fill:#62735b;paint-order:stroke;stroke:#fbfcf8;stroke-width:5;stroke-linejoin:round}.node rect{fill:#fff;stroke:#c7d2be;stroke-width:1.2}.node.decision rect{fill:#fbf2e1;stroke:#d8c193}.node.end rect{fill:#e7f0dc;stroke:#b8cba6}.node.alert rect{fill:#f8eae4;stroke:#ddbeb0}.node.active rect{stroke:#286143;stroke-width:2.5;fill:#e7f0da}.node-index{font:9px Consolas,monospace;fill:#8b9a7f}.node-title{font:600 13px Tahoma,sans-serif;fill:#294632}.node-sub{font:10px Tahoma,sans-serif;fill:#75836d}.node-dot{fill:#91aa7c}</style><rect width="100%" height="100%" fill="#fbfcf8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9fae98"/></marker></defs><path class="edge" d="M 480 106 C 480 133.0,480 133.0,480 160" marker-end="url(#arrow)"/><path class="edge" d="M 480 236 C 480 263.0,480 263.0,480 290" marker-end="url(#arrow)"/><path class="edge" d="M 480 366 C 480 393.0,150 393.0,150 420" marker-end="url(#arrow)"/><text class="edge-label" x="315.0" y="386.0" text-anchor="middle">paused / closed</text><path class="edge" d="M 480 366 C 480 393.0,810 393.0,810 420" marker-end="url(#arrow)"/><text class="edge-label" x="645.0" y="386.0" text-anchor="middle">near / overdue</text><path class="edge" d="M 810 496 C 810 523.0,810 523.0,810 550" marker-end="url(#arrow)"/><path class="edge" d="M 690 588 L 600 588" marker-end="url(#arrow)"/><text class="edge-label" x="645.0" y="579" text-anchor="middle">ยังไม่เคยแจ้ง</text><g class="node " transform="translate(360,30)"><title>อ่านนาฬิกากลาง</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">01</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">อ่านนาฬิกากลาง</text><text class="node-sub" x="14" y="59">เวลาทดสอบแช่แข็งใน SQLite</text></g><g class="node " transform="translate(360,160)"><title>ยกเลิกงานแก้ที่ครบเวลา</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">02</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ยกเลิกงานแก้ที่ครบเวลา</text><text class="node-sub" x="14" y="59">ก่อนเข้า page / API</text></g><g class="node decision" transform="translate(360,290)"><title>งานยังนับ SLA อยู่?</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">03</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">งานยังนับ SLA อยู่?</text><text class="node-sub" x="14" y="59">ไม่ใช่ NEED_FIX หรือ terminal</text></g><g class="node end" transform="translate(30,420)"><title>ไม่สร้างแจ้งเตือนใหม่</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">04</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">ไม่สร้างแจ้งเตือนใหม่</text><text class="node-sub" x="14" y="59">paused / closed</text></g><g class="node " transform="translate(690,420)"><title>เลือกผู้รับตามขั้นปัจจุบัน</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">05</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">เลือกผู้รับตามขั้นปัจจุบัน</text><text class="node-sub" x="14" y="59">ผู้ถือ / แผนก / head / issuer</text></g><g class="node decision" transform="translate(690,550)"><title>เคยแจ้งระดับนี้แก่คนนี้?</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">06</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">เคยแจ้งระดับนี้แก่คนนี้?</text><text class="node-sub" x="14" y="59">unique(case,recipient,level)</text></g><g class="node end" transform="translate(360,550)"><title>แสดงกระดิ่งและรายการ</title><rect width="240" height="76" rx="7"/><text class="node-index" x="14" y="17">07</text><circle class="node-dot" cx="223" cy="15" r="3"/><text class="node-title" x="14" y="39">แสดงกระดิ่งและรายการ</text><text class="node-sub" x="14" y="59">ผู้ใช้เห็นเฉพาะของตน</text></g></svg>